
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sea Life App</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap');

  :root{
    /* ocean palette */
    --deep-1:#03181f;
    --deep-2:#04283a;
    --deep-3:#0b4d63;
    --mid-4:#0d6e8c;
    --bio-cyan:#4fe3d1;
    --foam:#eaf9fb;
    --coral:#ff6b6b;
    --card-glass: rgba(255,255,255,0.10);
    --border-glass: rgba(255,255,255,0.28);
    --radius-lg: 22px;
    --radius-md: 14px;
    --shadow-soft: 0 20px 45px rgba(3,24,31,0.35);
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    font-family:'Poppins', sans-serif;
    color:var(--foam);
    background:
      radial-gradient(circle at 15% 10%, rgba(79,227,209,0.18), transparent 45%),
      linear-gradient(160deg, var(--deep-1) 0%, var(--deep-2) 45%, var(--deep-3) 100%);
    background-size:100% 100%, 220% 220%;
    background-attachment:fixed;
    transition: background-color 0.7s ease, color 0.7s ease;
    animation: oceanDrift 18s ease-in-out infinite;
    position:relative;
    overflow-x:hidden;
  }

  body.day{
    color:#04283a;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,0.35), transparent 45%),
      linear-gradient(160deg, #7ec8e3 0%, #9fdff0 45%, #ffe4a1 100%);
    background-size:100% 100%, 220% 220%;
  }

  @keyframes oceanDrift{
    0%   { background-position: 0 0, 0% 50%; }
    50%  { background-position: 0 0, 100% 50%; }
    100% { background-position: 0 0, 0% 50%; }
  }

  /* ===== RISING BUBBLES (whole page, parallax) ===== */
  @keyframes bubbleRiseA{
    0%   { background-position: 0 0, 40px 30px, 90px 70px, 140px 10px; }
    100% { background-position: 0 -420px, 40px -390px, 90px -350px, 140px -410px; }
  }
  @keyframes bubbleRiseB{
    0%   { background-position: 20px 0, 110px 40px, 170px 90px; }
    100% { background-position: 20px -520px, 110px -480px, 170px -530px; }
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    background-repeat:repeat-y;
    background-image:
      radial-gradient(4px 4px at 20px 30px, rgba(255,255,255,0.45), transparent 70%),
      radial-gradient(3px 3px at 90px 70px, rgba(255,255,255,0.35), transparent 70%),
      radial-gradient(5px 5px at 150px 20px, rgba(255,255,255,0.3), transparent 70%),
      radial-gradient(2px 2px at 200px 60px, rgba(255,255,255,0.4), transparent 70%);
    background-size:220px 420px;
    animation: bubbleRiseA 14s linear infinite;
    opacity:0.55;
  }

  body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    background-repeat:repeat-y;
    background-image:
      radial-gradient(6px 6px at 60px 50px, rgba(79,227,209,0.35), transparent 70%),
      radial-gradient(3px 3px at 160px 90px, rgba(255,255,255,0.3), transparent 70%),
      radial-gradient(4px 4px at 260px 30px, rgba(255,255,255,0.25), transparent 70%);
    background-size:320px 520px;
    animation: bubbleRiseB 22s linear infinite;
    opacity:0.45;
  }

  body.day::before, body.day::after{ opacity:0.35; }

  /* ===== SWIMMING FISH (school made from existing h3 tags, no HTML added) ===== */
  @keyframes swimRight{
    0%   { left:-8%; }
    100% { left:108%; }
  }
  @keyframes swimLeft{
    0%   { left:108%; }
    100% { left:-8%; }
  }

  .content h3{ position:relative; }

  .content h3::after{
    content:"🐟";
    position:fixed;
    pointer-events:none;
    z-index:0;
    font-size:22px;
    opacity:0.55;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,0.25));
  }

  .content h3:nth-child(3)::after{
    content:"🐠";
    top:18%;
    animation: swimRight 26s linear infinite;
    animation-delay:-2s;
  }
  .content h3:nth-child(4)::after{
    content:"🐟";
    top:38%;
    font-size:16px;
    opacity:0.4;
    transform:scaleX(-1);
    animation: swimLeft 19s linear infinite;
    animation-delay:-6s;
  }
  .content h3:nth-child(5)::after{
    content:"🐡";
    top:62%;
    animation: swimRight 32s linear infinite;
    animation-delay:-14s;
  }
  .content h3:nth-child(6)::after{
    content:"🐠";
    top:80%;
    font-size:18px;
    opacity:0.45;
    transform:scaleX(-1);
    animation: swimLeft 23s linear infinite;
    animation-delay:-4s;
  }
  .content h3:nth-child(2)::after{
    content:"🐟";
    top:52%;
    font-size:14px;
    opacity:0.35;
    animation: swimRight 21s linear infinite;
    animation-delay:-10s;
  }

  /* ===== ROCKY REEF (fixed to viewport bottom, behind the cards) ===== */
  .container::before{
    content:"";
    position:fixed;
    left:0; right:0; bottom:0;
    height:150px;
    z-index:0;
    pointer-events:none;
    background:linear-gradient(160deg,#0c3a46,#08262f 70%);
    opacity:0.85;
    clip-path:polygon(
      0% 100%, 0% 62%, 6% 78%, 13% 42%, 21% 68%, 29% 30%,
      38% 60%, 47% 20%, 56% 52%, 65% 34%, 73% 58%,
      82% 24%, 90% 50%, 96% 30%, 100% 55%, 100% 100%
    );
  }
  .container::after{
    content:"";
    position:fixed;
    left:0; right:0; bottom:0;
    height:90px;
    z-index:0;
    pointer-events:none;
    background:linear-gradient(160deg,#124a58,#0c3a46 70%);
    opacity:0.6;
    clip-path:polygon(
      0% 100%, 0% 75%, 10% 90%, 18% 55%, 27% 82%, 36% 45%,
      45% 78%, 55% 40%, 64% 72%, 74% 48%, 83% 80%,
      92% 42%, 100% 70%, 100% 100%
    );
  }

  /* ===== SWAYING SEAWEED ===== */
  @keyframes sway{
    0%, 100% { transform:rotate(-7deg); }
    50%      { transform:rotate(7deg); }
  }

  .content::before,
  .content::after,
  .website::before,
  .website::after,
  #resultTitle::before,
  #resultText::before{
    content:"";
    position:fixed;
    bottom:0;
    width:16px;
    z-index:0;
    pointer-events:none;
    transform-origin:bottom center;
    border-radius:50% 50% 10% 10% / 70% 70% 10% 10%;
    animation:sway 4.5s ease-in-out infinite;
  }
  .content::before{
    left:3%; height:95px;
    background:linear-gradient(180deg,#1f9d6b,#0f5132);
    animation-duration:5s;
  }
  .content::after{
    left:9%; height:60px; width:12px;
    background:linear-gradient(180deg,#2bb37e,#166b46);
    animation-duration:3.6s;
    animation-delay:-1.2s;
  }
  .website::before{
    left:80%; height:120px;
    background:linear-gradient(180deg,#1f9d6b,#0f5132);
    animation-duration:5.4s;
    animation-delay:-2s;
  }
  .website::after{
    left:87%; height:70px; width:12px;
    background:linear-gradient(180deg,#2bb37e,#166b46);
    animation-duration:4s;
    animation-delay:-0.6s;
  }
  #resultTitle::before{
    left:94%; height:80px;
    background:linear-gradient(180deg,#1f9d6b,#0f5132);
    animation-duration:4.8s;
    animation-delay:-3s;
  }
  #resultText::before{
    left:15%; height:70px; width:13px;
    background:linear-gradient(180deg,#2bb37e,#166b46);
    animation-duration:3.9s;
    animation-delay:-1.8s;
  }

  /* ===== JELLYFISH, CORAL & OTHER LIFE ===== */
  @keyframes jellyDrift{
    0%,100% { transform:translate(0,0); }
    50%     { transform:translate(14px,-26px); }
  }
  @keyframes pulseGlow{
    0%,100% { transform:scale(1); opacity:0.55; }
    50%     { transform:scale(1.18); opacity:0.85; }
  }
  @keyframes crawl{
    0%,100% { transform:translateX(0); }
    50%     { transform:translateX(40px); }
  }

  .content h1::before{
    content:"🪼";
    position:fixed;
    top:22%; left:75%;
    font-size:26px;
    opacity:0.45;
    z-index:0;
    pointer-events:none;
    animation:jellyDrift 9s ease-in-out infinite;
  }
  .content h1::after{
    content:"🪸";
    position:fixed;
    bottom:10px; left:6%;
    font-size:24px;
    z-index:0;
    pointer-events:none;
    animation:pulseGlow 6s ease-in-out infinite;
  }
  .h1::before{
    content:"🪼";
    position:fixed;
    top:60%; left:12%;
    font-size:22px;
    opacity:0.4;
    z-index:0;
    pointer-events:none;
    animation:jellyDrift 11s ease-in-out infinite;
    animation-delay:-4s;
  }
  .h1::after{
    content:"🪸";
    position:fixed;
    bottom:8px; left:90%;
    font-size:26px;
    z-index:0;
    pointer-events:none;
    animation:pulseGlow 7s ease-in-out infinite;
    animation-delay:-2.5s;
  }
  #resultTitle::after{
    content:"🦀";
    position:fixed;
    bottom:6px; left:45%;
    font-size:20px;
    z-index:0;
    pointer-events:none;
    animation:crawl 5s ease-in-out infinite;
  }
  #resultText::after{
    content:"🐢";
    position:fixed;
    top:75%; left:-6%;
    font-size:24px;
    opacity:0.5;
    z-index:0;
    pointer-events:none;
    animation:swimRight 34s linear infinite;
    animation-delay:-9s;
  }

  /* ===== MAIN LAYOUT ===== */
  .container{
    display:flex;
    flex-wrap:wrap;
    gap:32px;
    align-items:flex-start;
    justify-content:center;
    max-width:1200px;
    margin:0 auto;
    padding:56px 24px 90px;
    position:relative;
    z-index:1;
  }

  /* ===== LEFT PROFILE CARD ===== */
  .content{
    background:var(--card-glass);
    border:1px solid var(--border-glass);
    border-radius:var(--radius-lg);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    box-shadow:var(--shadow-soft), inset 0 1px 0 rgba(255,255,255,0.15);
    width:300px;
    flex-shrink:0;
    padding:28px 22px 32px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .content h1{
    font-size:1.5rem;
    font-weight:700;
    letter-spacing:0.5px;
    margin:0 0 20px;
    color:var(--bio-cyan);
    text-transform:uppercase;
  }

  .content-eyebrow{
    font-family:'Space Mono', monospace;
    font-size:0.66rem;
    letter-spacing:2.5px;
    color:var(--bio-cyan);
    text-transform:uppercase;
  }

  @keyframes floatBob{
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-9px) rotate(1.5deg); }
  }

  .img{
    width:112px;
    height:112px;
    object-fit:cover;
    border-radius:50%;
    border:3px solid var(--bio-cyan);
    box-shadow:0 0 0 4px rgba(79,227,209,0.18), 0 8px 20px rgba(0,0,0,0.35);
    margin:0 0 20px;
    animation: floatBob 5s ease-in-out infinite;
  }

  .content h3{
    width:100%;
    font-size:0.98rem;
    font-weight:500;
    display:flex;
    gap:10px;
    align-items:center;
    margin:0;
    padding:10px 4px;
    border-bottom:1px solid var(--border-glass);
  }
  .content h3:last-child{ border-bottom:none; }

  /* ===== RIGHT SIDE / APP ===== */
  .website{
    flex:1;
    min-width:320px;
    max-width:760px;
    background:var(--card-glass);
    border:1px solid var(--border-glass);
    border-radius:var(--radius-lg);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    box-shadow:var(--shadow-soft);
    padding:34px 30px 44px;
    position:relative;
    overflow:hidden;
  }

  .h1{
    text-align:center;
    font-size:2.6rem;
    font-weight:800;
    letter-spacing:0.5px;
    margin:0 0 22px;
    background:linear-gradient(90deg, var(--bio-cyan), #7fd8ff);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .salom{
    width:100%;
    max-width:900px;
    border-radius:var(--radius-md);
    display:block;
    margin:0 auto 26px;
    box-shadow:0 14px 30px rgba(0,0,0,0.3);
    animation: floatBob 7s ease-in-out infinite;
    animation-delay:-1.5s;
  }

  /* ===== INPUT + BUTTON ===== */
  #animalInput{
    width:100%;
    max-width:420px;
    padding:14px 18px;
    font-size:16px;
    font-family:inherit;
    color:#04283a;
    border-radius:999px;
    border:1px solid var(--border-glass);
    outline:none;
    margin:0 auto 14px;
    display:block;
    background:var(--foam);
    box-shadow:inset 0 2px 6px rgba(0,0,0,0.08);
    transition:box-shadow 0.25s ease, transform 0.25s ease;
  }
  #animalInput::placeholder{ color:#5b7d8a; }
  #animalInput:focus{
    box-shadow:0 0 0 3px rgba(79,227,209,0.55);
    transform:translateY(-1px);
  }

  button{
    display:block;
    margin:0 auto;
    padding:13px 34px;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    letter-spacing:0.3px;
    border:none;
    border-radius:999px;
    background:linear-gradient(135deg, var(--mid-4), var(--bio-cyan));
    color:#03181f;
    cursor:pointer;
    box-shadow:0 10px 22px rgba(13,110,140,0.45);
    transition:transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
  }
  button:hover{
    transform:translateY(-2px);
    filter:brightness(1.08);
    box-shadow:0 14px 28px rgba(13,110,140,0.55);
  }
  button:active{ transform:translateY(0); }
  button:focus-visible{ outline:3px solid var(--coral); outline-offset:3px; }

  /* pufakchalar — qidiruv tugmasi / input hududidan ko'tarilib turadi */
  button{ position:relative; z-index:1; }

  @keyframes bubbleUp{
    0%   { transform:translateY(0) scale(0.6); opacity:0; }
    15%  { opacity:0.9; }
    85%  { opacity:0.5; }
    100% { transform:translateY(-160px) scale(1); opacity:0; }
  }

  button::before,
  button::after{
    content:"";
    position:absolute;
    bottom:6px;
    width:9px;
    height:9px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95), rgba(255,255,255,0.15));
    box-shadow:0 0 6px rgba(255,255,255,0.5);
    pointer-events:none;
    animation:bubbleUp 3.2s ease-in infinite;
  }
  button::before{ left:22%; animation-delay:-0.6s; width:6px; height:6px; }
  button::after { left:70%; animation-delay:-2s; width:11px; height:11px; }

  /* ===== RESULT ===== */
  #resultTitle{
    text-align:center;
    font-size:1.6rem;
    font-weight:700;
    color:var(--bio-cyan);
    margin-top:34px;
  }

  #resultText{
    width:100%;
    max-width:560px;
    margin:18px auto 0;
    padding:24px 26px;
    background:var(--foam);
    color:#183642;
    border-radius:var(--radius-md);
    box-shadow:0 12px 28px rgba(0,0,0,0.25);
    line-height:1.8;
    border-left:6px solid var(--bio-cyan);
  }

  #resultImg{
    width:280px;
    max-width:80%;
    display:none;
    margin:24px auto 0;
    border-radius:var(--radius-md);
    box-shadow:0 12px 28px rgba(0,0,0,0.3);
    animation: floatBob 6s ease-in-out infinite;
    animation-delay:-3s;
  }

  /* ===== DAY / NIGHT TOGGLE ===== */
  :root{
    --sun-color:#ffb703;
    --moon-color:#e2e8f0;
    --track-shadow: rgba(0,0,0,0.25);
  }

  .stage{
    position:fixed;
    top:22px;
    right:26px;
    z-index:10;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }

  .label{
    font-family:'Space Mono', monospace;
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--foam);
    opacity:0.85;
    transition:color 0.6s ease;
  }
  body.day .label{ color:#04283a; }

  .toggle{
    --w:118px;
    --h:54px;
    --pad:5px;
    width:var(--w);
    height:var(--h);
    border:none;
    border-radius:999px;
    position:relative;
    cursor:pointer;
    padding:0;
    background:linear-gradient(135deg, var(--deep-1), var(--deep-3));
    box-shadow:inset 0 2px 6px var(--track-shadow), 0 8px 20px rgba(0,0,0,0.4);
    transition:background 0.6s ease;
    overflow:hidden;
  }
  .toggle.day{
    background:linear-gradient(135deg, #7ec8e3, #ffe4a1);
  }

  .stars{ position:absolute; inset:0; opacity:1; transition:opacity 0.5s ease; }
  .toggle.day .stars{ opacity:0; }
  .stars span{
    position:absolute;
    width:2px; height:2px;
    background:#fff;
    border-radius:50%;
  }

  .clouds{ position:absolute; inset:0; opacity:0; transition:opacity 0.5s ease; }
  .toggle.day .clouds{ opacity:1; }
  .clouds span{
    position:absolute;
    background:rgba(255,255,255,0.85);
    border-radius:999px;
  }

  .knob{
    position:absolute;
    top:var(--pad);
    left:var(--pad);
    width:calc(var(--h) - var(--pad) * 2);
    height:calc(var(--h) - var(--pad) * 2);
    border-radius:50%;
    background:var(--moon-color);
    box-shadow:0 3px 8px rgba(0,0,0,0.4), inset -4px -4px 0 rgba(0,0,0,0.08);
    transition:transform 0.5s cubic-bezier(.68,-0.4,.27,1.4), background 0.5s ease, box-shadow 0.5s ease;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .toggle.day .knob{
    transform:translateX(calc(var(--w) - var(--h)));
    background:var(--sun-color);
    box-shadow:0 0 18px 4px rgba(255,183,3,0.7), inset -3px -3px 0 rgba(255,255,255,0.3);
  }

  .knob svg{ width:60%; height:60%; position:absolute; opacity:0; transition:transform 0.5s ease; }
  .knob svg.moon-icon{ opacity:1; }
  .toggle.day .knob svg.sun-icon{ opacity:1; transform:rotate(90deg); }
  .toggle.day .knob svg.moon-icon{ opacity:0; }

  /* ===== RESPONSIVE ===== */
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; }
  }

  @media (max-width:720px){
    .container{ padding:100px 16px 60px; }
    .content{ width:100%; max-width:340px; }
    .h1{ font-size:2rem; }
    .stage{ top:14px; right:14px; transform:scale(0.85); transform-origin:top right; }
  }
</style>
</head>
